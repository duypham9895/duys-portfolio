name: Deploy to Vercel

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# One run per ref: a newer push to develop cancels the older one, so an older
# build can never finish last and overwrite production. PRs get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Scan built pages for banned content
        run: node scripts/qa/scan-dist.mjs

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload resume PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: public/resume*.pdf
          if-no-files-found: warn

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install -g vercel@latest

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
